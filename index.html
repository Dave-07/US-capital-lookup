<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="icon" href="icons8-us-96.png" type="image/png" />
    <title>State Capital Lookup - USA</title>
  </head>

  <body>
    <div class="stars" id="stars-container"></div>

    <div class="container">
      <div class="header">
        <div class="eagle">🦅</div>
        <h1>
          <i class="fas fa-flag-usa flag-icon"></i>
          State Capital Lookup
        </h1>
        <p class="subtitle">Discover America's Great States & Capitals</p>
      </div>

      <div class="search-container">
        <input
          type="text"
          id="search"
          class="search-input"
          placeholder="Enter state name or abbreviation... 🇺🇸"
          autocomplete="off"
        />
      </div>

      <div id="match-list" class="match-list"></div>
    </div>
    <script src="app.js" type="module"></script>
    <script src="stars.js" defer></script>
  </body>
</html>
